<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Booststrape Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Custom login & register CSS -->
    <link rel="stylesheet" href="css/Auth.css">
    <title>Register</title>
</head>
<body>
    
    <!-- start Register -->
    <section id="register" class="login-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="login-card p-4 p-md-5">
                        <h3 class="text-center mb-3 primary-color">Create your account</h3>
                        <p class="text-center text-muted mb-4">Join FitTrack and start your fitness journey today</p>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Full name</label>
                                <input type="text" class="form-control form-control-lg" placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="name@example.com" required>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Age</label>
                                    <input type="number" class="form-control form-control-lg" min="12" max="100" placeholder="24" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select form-select-lg" required>
                                        <option value="" selected disabled>Choose...</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Goal</label>
                                    <select class="form-select form-select-lg" required>
                                        <option value="" selected disabled>Choose...</option>
                                        <option value="loss">Weight loss</option>
                                        <option value="gain">Muscle gain</option>
                                        <option value="maintain">Maintain weight</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mt-0">
                                <div class="col-md-6">
                                    <label class="form-label">Height (cm)</label>
                                    <div class="input-group input-group-lg">
                                        <input type="number" class="form-control" min="100" max="250" placeholder="175" required>
                                        <span class="input-group-text">cm</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Weight (kg)</label>
                                    <div class="input-group input-group-lg">
                                        <input type="number" class="form-control" min="30" max="300" placeholder="72" required>
                                        <span class="input-group-text">kg</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3 mt-3">
                                <label class="form-label">Activity level</label>
                                <select class="form-select form-select-lg" required>
                                    <option value="" selected disabled>Select activity</option>
                                    <option value="sedentary">Sedentary</option>
                                    <option value="light">Lightly active</option>
                                    <option value="moderate">Moderately active</option>
                                    <option value="very">Very active</option>
                                </select>
                                <div class="form-text">Used to estimate your daily calories (TDEE).</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-0">Password</label>
                                <input type="password" class="form-control form-control-lg" placeholder="••••••••" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label mb-0">Confirm password</label>
                                <input type="password" class="form-control form-control-lg" placeholder="••••••••" minlength="6" required>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">I agree to the Terms and Privacy Policy</label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Create account</button>
                        </form>
                        <div class="sep my-4 text-center"><span>or sign up with</span></div>
                        <div class="row g-2">
                            <div class="col-6"><button class="btn btn-google w-100"><span class="me-2">G</span> Google</button></div>
                            <div class="col-6"><button class="btn btn-facebook w-100"><span class="me-2">f</span> Facebook</button></div>
                        </div>
                        <p class="text-center text-muted mt-4 mb-0">Already have an account? <a href="login.html">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- end Login -->
    
    <!-- Bootstrap Bundle with Popper -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
