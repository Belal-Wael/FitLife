<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Booststrape Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Custom login & register CSS -->
    <link rel="stylesheet" href="css/Auth.css">
    <title>Login</title>
</head>
<body>
    
    <!-- start Login -->
    <section id="login" class="login-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="login-card p-4 p-md-5">
                        <h3 class="text-center mb-3 primary-color">Welcome back</h3>
                        <p class="text-center text-muted mb-4">Sign in to continue your fitness journey</p>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="name@example.com">
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label class="form-label mb-0">Password</label>
                                    <a href="#" class="small">Forgot password?</a>
                                </div>
                                <input type="password" class="form-control form-control-lg" placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
                        </form>
                        <div class="sep my-4 text-center"><span>or continue with</span></div>
                        <div class="row g-2">
                            <div class="col-6"><button class="btn btn-google w-100"> Google</button></div>
                            <div class="col-6"><button class="btn btn-facebook w-100">Facebook</button></div>
                        </div>
                        <p class="text-center text-muted mt-4 mb-0">Don’t have an account? <a href="./register.html">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- end Login -->
    
    <!-- Bootstrap Bundle with Popper -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
